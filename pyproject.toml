[project]
name = "thaijp-accent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pythainlp>=5.0", "python-crfsuite", "pyyaml", "jiwer", "numpy", "soundfile"]

[project.optional-dependencies]
g2p = ["transformers", "torch", "sentencepiece"]
dev = ["pytest", "jupytext", "nbformat"]

[tool.setuptools]
packages = ["thaijp_accent", "colab"]

[tool.setuptools.package-data]
thaijp_accent = ["*.yaml", "*.tsv"]

[tool.pytest.ini_options]
markers = ["network: needs internet / HF models"]
testpaths = ["tests"]
