[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thaijp-accent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pythainlp>=5.0", "python-crfsuite", "pyyaml", "jiwer", "numpy", "soundfile"]

[project.optional-dependencies]
g2p = ["transformers", "torch", "sentencepiece"]
dev = ["pytest", "jupytext", "nbformat", "librosa", "ruff"]

[dependency-groups]
dev = ["pytest", "jupytext", "nbformat", "librosa", "ruff"]

# Training env (CUDA machine / Colab). Training cannot run on Mac: SBV2 train_ms_jp_extra.py is CUDA-only.
train = ["setuptools<81", "soxr", "tensorboard", "ml_dtypes>=0.5.1",
         "torch", "transformers", "sentencepiece", "librosa"]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools]
packages = ["thaijp_accent", "colab"]

[tool.setuptools.package-data]
thaijp_accent = ["*.yaml", "*.tsv"]

[tool.pytest.ini_options]
markers = ["network: needs internet / HF models"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"notebooks_src/*" = ["E402", "E401", "E702"]
