[project]
name = "thaijp-accent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pythainlp>=5.0", "python-crfsuite", "pyyaml", "jiwer", "numpy", "soundfile"]

[project.optional-dependencies]
# torch/transformers drive both the G2P model and the Whisper+UTMOS eval;
# librosa is needed by eval.utmos and was previously undeclared.
g2p = ["transformers", "torch", "sentencepiece", "librosa"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["thaijp_accent", "colab"]

[tool.setuptools.package-data]
thaijp_accent = ["*.yaml", "*.tsv"]

[dependency-groups]
# The offline suite exercises the Whisper/UTMOS eval paths, so dev needs the
# g2p extra (torch, transformers) even though runtime does not.
dev = ["pytest", "jupytext", "nbformat", "ruff>=0.15", "thaijp-accent[g2p]"]

[tool.uv]
# Colab and the Mac notebook both run 3.12; keep the lock resolved for that.
default-groups = ["dev"]

[tool.pytest.ini_options]
markers = ["network: needs internet / HF models"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    # Line length is the formatter's job; flagging it would only add noise to
    # the IPA/tone tables and the Thai-language notebook prose.
    "E501",
    # Thai text, kana and IPA symbols are the subject matter, not typos.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# jupytext percent-scripts: cells import where they need to and define names
# the next cell uses, so top-of-file import rules do not apply.
"notebooks_src/*.py" = ["E402", "F401", "E731", "SIM115", "B905"]
# Test idioms: sys.path/fixture imports mid-file, `l` for a line, paired
# one-line setup statements, dict(...) kwargs in expected-payload literals.
"tests/*.py" = ["B011", "E402", "E741", "E702", "C408"]

[tool.ruff.format]
docstring-code-format = true
